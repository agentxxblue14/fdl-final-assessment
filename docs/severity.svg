<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 200" width="780" height="200" role="img" aria-label="Bug severity levels and response times"><title>Bug severity levels and response times</title><rect width="780" height="200" rx="14" fill="#ffffff"/><rect x="40" y="22" width="74" height="160" rx="16" fill="#17232f"/><rect x="70" y="182" width="14" height="14" fill="#17232f"/><circle cx="77" cy="52" r="19" fill="#c4473a"/><circle cx="71" cy="46" r="5" fill="#fff" opacity=".35"/><line x1="104" y1="52" x2="150" y2="52" stroke="#d8dee6" stroke-width="1.5"/><text x="160" y="48" font-family="Bahnschrift, 'DIN Alternate', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#17232f" text-anchor="start" >Critical</text><text x="300" y="48" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#17232f" text-anchor="start" >fix or roll back the same day, owner told within the hour</text><text x="300" y="65" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6a77" text-anchor="start" >Example: one company sees another&#x27;s data, production down, wrong money totals</text><circle cx="77" cy="102" r="19" fill="#e39b2d"/><circle cx="71" cy="96" r="5" fill="#fff" opacity=".35"/><line x1="104" y1="102" x2="150" y2="102" stroke="#d8dee6" stroke-width="1.5"/><text x="160" y="98" font-family="Bahnschrift, 'DIN Alternate', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#17232f" text-anchor="start" >High</text><text x="300" y="98" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#17232f" text-anchor="start" >fixed within 2 working days</text><text x="300" y="115" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6a77" text-anchor="start" >Example: a main workflow is broken for some users</text><circle cx="77" cy="152" r="19" fill="#2f8a57"/><circle cx="71" cy="146" r="5" fill="#fff" opacity=".35"/><line x1="104" y1="152" x2="150" y2="152" stroke="#d8dee6" stroke-width="1.5"/><text x="160" y="148" font-family="Bahnschrift, 'DIN Alternate', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#17232f" text-anchor="start" >Normal or low</text><text x="300" y="148" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#17232f" text-anchor="start" >planned into next week&#x27;s work</text><text x="300" y="165" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6a77" text-anchor="start" >Example: a workaround exists, or it is cosmetic</text></svg>